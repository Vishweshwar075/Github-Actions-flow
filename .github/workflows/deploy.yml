name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [ "main" ]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment Target Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy Application
    runs-on: [self-hosted, linux]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Package Executable JAR
        run: mvn clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app-jar
          path: target/*.jar
          retention-days: 7

      - name: Deploy to Linux Server
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          echo "=========================================="
          echo "Deploying to Environment: $ENV (Self-Hosted Linux)"
          echo "Deploying JAR: $(ls target/*.jar)"
          echo "Application: github-actions-springboot-demo"
          echo "Port: 8080"
          echo "Host: $(hostname)"
          echo "=========================================="
          echo "Simulating server deployment and health checks..."
          sleep 2
          echo "Deployment to $ENV completed successfully on $(hostname)!"